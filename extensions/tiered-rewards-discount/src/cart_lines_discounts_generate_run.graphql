query CartInput {
  cart {
    buyerIdentity {
      customer {
        hasAnyTag(tags: ["Canada Shopper", "MD-CAN Shopper"])
      }
    }
    lines {
      id
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            inAnyCollection(ids: ["gid://shopify/Collection/527357477083"])
          }
        }
      }
    }
    cost {
      subtotalAmount {
        amount
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "tiered-rewards", key: "config") {
      value
    }
  }
  shop {
    localTime {
      # BF promo window, expressed in the store's timezone (Mountain Time).
      # 12:00 AM MDT 7/9 through 11:59 PM MDT 7/14, 2026.
      bfPromoWindow: dateTimeBetween(
        startDateTime: "2026-07-09T00:00:00"
        endDateTime: "2026-07-14T23:59:59"
      )
    }
  }
  enteredDiscountCodes {
    code
  }
  presentmentCurrencyRate
}
