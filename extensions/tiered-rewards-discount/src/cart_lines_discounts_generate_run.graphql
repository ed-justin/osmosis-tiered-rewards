query CartInput {
  cart {
    buyerIdentity {
      customer {
        hasAnyTag(tags: ["Canada Shopper", "CanadaShopper", "MD-CAN Shopper"])
      }
    }
    lines {
      id
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            inAnyCollection(ids: ["gid://shopify/Collection/527357477083"])
          }
        }
      }
    }
    cost {
      subtotalAmount {
        amount
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "tiered-rewards", key: "config") {
      value
    }
  }
  shop {
    localTime {
      # BF promo windows, expressed in the store's timezone (Mountain Time).
      # All Access: 12:00 AM MT 10/12 through 11:59 PM MT 10/16, 2026.
      bfPromoWindow: dateTimeBetween(
        startDateTime: "2026-10-12T00:00:00"
        endDateTime: "2026-10-16T23:59:59"
      )
      # Encore: 12:00 AM MT 11/16 through 11:59 PM MT 11/18, 2026.
      bfEncoreWindow: dateTimeBetween(
        startDateTime: "2026-11-16T00:00:00"
        endDateTime: "2026-11-18T23:59:59"
      )
    }
  }
  enteredDiscountCodes {
    code
  }
  presentmentCurrencyRate
}
